[package]
name = "truckpilot-diag"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TruckPilot diagnostic tool — checks all subsystems before a live run"

[[bin]]
name = "truckpilot-diag"
path = "src/main.rs"

[[bin]]
name = "truckpilot-item-census"
path = "src/bin/item_census.rs"

[[bin]]
name = "truckpilot-archive-audit"
path = "src/bin/archive_audit.rs"

[[bin]]
name = "truckpilot-vis-uid-audit"
path = "src/bin/vis_uid_audit.rs"

[[bin]]
name = "truckpilot-anchor-junction-audit"
path = "src/bin/anchor_junction_audit.rs"

[[bin]]
name = "truckpilot-h4c-ppd-check"
path = "src/bin/h4c_ppd_check.rs"

[[bin]]
name = "truckpilot-h4c-prefab-roi"
path = "src/bin/h4c_prefab_roi.rs"

[dependencies]
truckpilot-telemetry = { path = "../telemetry" }
truckpilot-map-parser = { path = "../map-parser" }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
dirs             = "5.0"

# HTTP check
ureq = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }
