[package]
name = "truckpilot-diag"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TruckPilot diagnostic tool — checks all subsystems before a live run"

[[bin]]
name = "truckpilot-diag"
path = "src/main.rs"

[[bin]]
name = "truckpilot-item-census"
path = "src/bin/item_census.rs"

[[bin]]
name = "truckpilot-archive-audit"
path = "src/bin/archive_audit.rs"

[[bin]]
name = "truckpilot-vis-uid-audit"
path = "src/bin/vis_uid_audit.rs"

[[bin]]
name = "truckpilot-anchor-junction-audit"
path = "src/bin/anchor_junction_audit.rs"

[[bin]]
name = "truckpilot-h4c-ppd-check"
path = "src/bin/h4c_ppd_check.rs"

[[bin]]
name = "truckpilot-h4c-prefab-roi"
path = "src/bin/h4c_prefab_roi.rs"

[[bin]]
name = "truckpilot-ets2la-traffic-probe"
path = "src/bin/ets2la_traffic_probe.rs"

[[bin]]
name = "truckpilot-router-perf-audit"
path = "src/bin/router_perf_audit.rs"

[[bin]]
name = "shm-frame-reader"
path = "src/bin/shm_frame_reader.rs"

[[bin]]
name = "truckpilot-vjoy-probe"
path = "src/bin/vjoy_probe.rs"

[[bin]]
name = "blackboard-query"
path = "src/bin/blackboard_query.rs"

[[bin]]
name = "engage-cli"
path = "src/bin/engage_cli.rs"

[[bin]]
name = "routing-islands"
path = "src/bin/routing-islands.rs"

[[bin]]
name = "cross-sector-audit"
path = "src/bin/cross-sector-audit.rs"

[[bin]]
name = "road-drop-audit"
path = "src/bin/road-drop-audit.rs"

[[bin]]
name = "sign-precrash-audit"
path = "src/bin/sign-precrash-audit.rs"

[[bin]]
name = "sign-format-compare"
path = "src/bin/sign-format-compare.rs"

[[bin]]
name = "bothunresolved-forensik"
path = "src/bin/bothunresolved-forensik.rs"

[[bin]]
name = "node-parser-hex-audit"
path = "src/bin/node-parser-hex-audit.rs"

[[bin]]
name = "multi-sector-audit"
path = "src/bin/multi-sector-audit.rs"

[[bin]]
name = "bezier-size-scan"
path = "src/bin/bezier-size-scan.rs"

[[bin]]
name = "sec-single-inspect"
path = "src/bin/sec-single-inspect.rs"

[[bin]]
name = "validate-cities"
path = "src/bin/validate-cities.rs"

[[bin]]
name = "uid-lookup"
path = "src/bin/uid-lookup.rs"

[dependencies]
rustc-hash      = "2"
truckpilot-telemetry = { path = "../telemetry" }
truckpilot-map-parser = { path = "../map-parser" }
truckpilot-ipc-protocol = { path = "../ipc-protocol" }
tungstenite = "0.24"
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
dirs             = "5.0"
clap             = { version = "4", features = ["derive"] }

anyhow = "1"

# HTTP check
ureq = "2"

# SHM frame reader (Phase 6.5c.1)
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
] }
ctrlc  = "3"
