[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimap-sidecar"
version = "0.1.0"
description = "TruckPilot VMM-2 — OpenCV minimap sidecar: DXcam capture + route-line detection + SHM publish"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TruckPilot" }]
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "dxcam>=0.0.5; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
minimap-sidecar = "minimap_sidecar.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
