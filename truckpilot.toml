[acc]
enabled = false
kd = 0.2
ki = 0.02
kp = 0.8
target_distance_m = 50.0

[logging]
verbose = false

[overlay]
fov_h_deg = 60.02552795410156

[plugins.ets2-nav-bridge]
enabled = true

[plugins.lane-data-collector]
capture_interval_ticks = 50
enabled = true
max_frames = 500
output_dir = "data/captures"

[plugins.lane-detection]
enabled = true
exist_thresh = 0.5
model_path = "C:/Users/Sippler/Documents/TruckPilot/tools/ufld-test/models/ufldv2_tusimple_res18_320x800.onnx"

[plugins.lane-keeper]
# Laterales Engage-Gate: Truck muss <= diesem Wert (m) von der Soll-Linie entfernt sein.
# Bei lane-side-Bug ggf. auf 5-6 m erhöhen bis der Offset-Bug behoben ist.
engage_max_lateral_m = 6.0

[plugins.lane-follower]
junction_bias_max_prefab_dist_m = 10.0
junction_bias_radius_m = 30.0
# FIX 2: conservative junction detection (live-tunable). Forward-cone is the key filter.
junction_detection_radius_m = 18.0
junction_detection_spread_deg = 50.0
junction_forward_cone_deg = 60.0
junction_max_heading_diff_deg = 45.0
junction_min_activation_frames = 6

[plugins.minimap-vision]
