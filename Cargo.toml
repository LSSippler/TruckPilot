[workspace]
members = [
    "crates/plugin-api",
    "crates/core",
    "crates/telemetry",
    "crates/telemetry-dll",
    "crates/ipc-protocol",
    "crates/map-parser",
    "crates/diag",
    "crates/ui/src-tauri",
    "crates/xtask",
    "crates/examples/hello-world",
    "crates/plugins/router",
    "crates/plugins/lane-keeper",
    "crates/plugins/speed-controller",
    "crates/plugins/acc",
    "crates/plugins/vjoy-output",
    "crates/plugins/sign-reader",
    "crates/plugins/sign-vision",
    "crates/plugins/lane-changer",
    "crates/plugins/fuel-stops",
    "crates/plugins/break-planner",
    "crates/plugins/stats-logger",
    "crates/plugins/vision-frame-source",
    "crates/plugins/lane-data-collector",
    "crates/plugins/ets2-nav-bridge",
    "crates/plugins/scs-sdk-output",
    "crates/plugins/lane-detection",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TruckPilot Contributors"]
license = "MIT"
repository = "https://github.com/geekom/TruckPilot"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
binrw = "0.14"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
zip = "2"
thiserror = "1"
tauri = "2"
tauri-build = "2"
